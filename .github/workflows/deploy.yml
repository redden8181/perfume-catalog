name: Deploy

# Каждый push в main/master:
#   собрать сайт → опубликовать в ветку gh-pages → сайт обновлён.
#
# Работает с настройками GitHub Pages «из коробки» (Deploy from a branch).
# Workflow дополнительно пытается включить Pages сам через API.
# Единственное требование — публичный репозиторий (на бесплатном тарифе).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # публикация в ветку gh-pages
  pages: write    # авто-включение Pages через API

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Сборка и публикация
    runs-on: ubuntu-latest
    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # GitHub Pages раздаёт сайт из /<имя-репозитория> — считаем base path.
      - name: Вычислить base path
        id: basepath
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$REPO" >> "$GITHUB_OUTPUT"
          fi

      - name: Установить зависимости
        run: npm ci

      - name: Собрать статический сайт
        run: npm run build
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.base_path }}

      # Классический надёжный деплой: содержимое out/ кладём в ветку gh-pages.
      # Action сам добавляет .nojekyll.
      - name: Опубликовать в ветку gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: ${{ github.sha }}"

      # Включаем Pages сами, если ещё не включён. Если репозиторий приватный
      # на бесплатном тарифе — выведем подсказку.
      - name: Включить GitHub Pages (если ещё не включён)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" -X POST \
            -f "source[branch]=gh-pages" -f "source[path]=/" --silent \
          || gh api "repos/${GITHUB_REPOSITORY}/pages" -X PUT \
            -f "source[branch]=gh-pages" -f "source[path]=/" --silent \
          || echo "::notice::Включите Pages вручную: Settings → Pages → Deploy from a branch → ветка gh-pages → Save"

      - name: Показать адрес сайта
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          if [[ "$REPO" == *.github.io ]]; then
            URL="https://${REPO}/"
          else
            URL="https://${OWNER}.github.io/${REPO}/"
          fi
          echo "## Ваш сайт" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
