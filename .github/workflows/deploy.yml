name: Build and Deploy to GitHub Pages

# Запускается после каждого push в main (или вручную через Actions → Run workflow)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно крутится только один деплой
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Если закоммитите package-lock.json, замените на: npm ci
      - name: Установить зависимости
        run: npm install

      - name: Собрать проект
        run: npm run build

      - name: Подготовить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузить собранный сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
